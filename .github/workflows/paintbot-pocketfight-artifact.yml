name: Build Paintbot pocket-fight variant

on:
  workflow_dispatch:
  push:
    paths:
      - "players/baseline/**"
      - "src/**"
      - "ctf.nimble"
      - "nimby.lock"
      - "players/baseline/Dockerfile"
      - ".github/workflows/paintbot-pocketfight-artifact.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Linux/amd64 pocket-fight policy image
        run: docker build --platform linux/amd64 --build-arg NIM_DEFINES="-d:pocketFight" -f players/baseline/Dockerfile -t paintbot-pocketfight:ci .

      - name: Export OCI-compatible Docker archive
        run: docker save paintbot-pocketfight:ci -o paintbot-pocketfight.tar

      - name: Upload policy archive
        uses: actions/upload-artifact@v4
        with:
          name: paintbot-pocketfight-docker-archive
          path: paintbot-pocketfight.tar
          if-no-files-found: error
          retention-days: 7
